<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POTAL お引越し</title>
  <style>
    @font-face {
      font-family: "mainFont";
      src: url("./x12y16pxMaruMonica.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --bg: #fff7fb;
      --pink: #d94b8a;
      --cyan: #4bbfd9;
      --line: #f0cfe0;
      --text: #4c3440;
      --muted: #8f6d7d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(75, 191, 217, 0.18), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: "mainFont", "Yu Gothic", "Meiryo", sans-serif;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      border: 2px solid var(--line);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.82);
      padding: 42px 34px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(217, 75, 138, 0.12);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--cyan);
      font-size: 14px;
    }

    h1 {
      margin: 0 0 20px;
      color: var(--pink);
      font-size: clamp(42px, 8vw, 72px);
      line-height: 1;
    }

    h2 {
      margin: 0 0 18px;
      color: var(--pink);
      font-size: 28px;
    }

    p {
      margin: 0 0 26px;
      color: var(--muted);
      line-height: 1.9;
      font-size: 16px;
    }

    .button {
      display: inline-block;
      border: 2px dashed var(--pink);
      border-radius: 999px;
      padding: 14px 28px;
      background: rgba(217, 75, 138, 0.08);
      color: var(--pink);
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }

    .button:hover {
      background: rgba(217, 75, 138, 0.16);
    }

    .url {
      margin-top: 22px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">personal game archive</p>
    <h1>POTAL</h1>

    <h2>お引越ししました</h2>

    <p>
      POTAL本体はGoogle Apps Script版へ移動しました。<br>
      下のボタンから開いてください。
    </p>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbw-K0EzIxiStt34alC2oGzdsdXOVsbEHgMPADZSR8lnbHl42mrrx3JcoTrMCKSSSn4I/exec"
      target="_blank"
      rel="noopener noreferrer"
    >
      Googleポータルを開く
    </a>

    <p class="url">
      https://script.google.com/macros/s/AKfycbw-K0EzIxiStt34alC2oGzdsdXOVsbEHgMPADZSR8lnbHl42mrrx3JcoTrMCKSSSn4I/exec
    </p>
  </main>
</body>
</html>
